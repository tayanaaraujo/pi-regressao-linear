name: Test Model

on:
  workflow_dispatch:
    inputs:
      csv_file:
        description: "Nome do CSV de teste dentro da pasta data/"
        required: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar modelo treinado
        uses: actions/download-artifact@v4
        with:
          name: modelo_treinado
          path: models/

      - name: Executar teste
        run: python scripts/test.py data/${{ github.event.inputs.csv_file }}

      - name: Enviar resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados_teste
          path: results/
