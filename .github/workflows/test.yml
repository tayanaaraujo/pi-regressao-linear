name: Test Model

on:
  workflow_run:
    workflows: ["Train Model"]
    types:
      - completed

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained_model
          path: .

      - name: Unzip model
        run: unzip trained_model.zip

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: python scripts/test.py data/PI_train.csv
