name: Train Model

on:
  workflow_dispatch:
    inputs:
      csv_file:
        description: "Nome do CSV de treino dentro da pasta data/"
        default: "PI_train.csv"
        required: true

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar treino
        run: python scripts/train.py data/${{ github.event.inputs.csv_file }}

      - name: Enviar artefatos (modelo)
        uses: actions/upload-artifact@v4
        with:
          name: modelo_treinado
          path: models/
