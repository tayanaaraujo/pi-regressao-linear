name: Train Model

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train Model
        run: python scripts/train.py data/PI_train.csv

      - name: Zip models
        run: |
          cd models
          zip -r ../trained_model.zip .

      - name: Upload trained model
        uses: actions/upload-artifact@v3
        with:
          name: trained_model
          path: trained_model.zip
